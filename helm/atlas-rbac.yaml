# atlas's grant for the System tag loop (cmd/atlas/tags.go): it lists ArgoCD's Applications to resolve against. The
# common-app-chart renders no ServiceAccount and no RBAC, and a standing grant is reviewed in infra-bootstrap
# gitops/platform/ (as ukubi-bridge's helm/kwatch-rbac.yaml), so this file is applied from there, moved as it is,
# never by this repo's Application. Then helm/values.yaml sets serviceAccountName: atlas.
#
# Read only: get and list, on Applications in every namespace (kwatch names an app outside argocd <namespace>/<name>,
# and atlas must see the same set). No watch: atlas lists every minute. No secrets, no other resource.
#
# The loop also needs, outside this file: ATLAS_BRIDGE_URL and ATLAS_BRIDGE_PASSWORD_FILE (the bridge-atlas service
# account's app password, mounted from a Secret), and, for a token URL that is authentik's in-cluster Service,
# atlas's pods listed in authentik's ingress fence (infra-bootstrap gitops/bootstrap/authentik-ciliumnetworkpolicy.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: atlas
  namespace: mountain
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: atlas-applications-read
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: atlas-applications-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: atlas-applications-read
subjects:
  - kind: ServiceAccount
    name: atlas
    namespace: mountain
