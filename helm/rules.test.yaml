# promtool unit tests for the PrometheusRule in helm/values.yaml extraManifests.
# Run by rules_test.go, which extracts the rules (namespace "mountain") to rules.yaml next to a copy of this file.
rule_files: [rules.yaml]
evaluation_interval: 15s
tests:
  - interval: 15s
    input_series:
      # prom polls fine (gauge follows the clock); alerts never succeeded: seeded at start (t=0) and stuck
      - series: 'mountain_source_last_success{namespace="mountain", source="prom"}'
        values: '0+15x40'
      - series: 'mountain_source_last_success{namespace="mountain", source="alerts"}'
        values: '0+0x40'
      # db in memory-only mode (DATABASE_URL unset): seeded at start, never refreshed
      - series: 'mountain_source_last_success{namespace="mountain", source="db"}'
        values: '0+0x40'
      - series: 'mountain_github_token_days_left{namespace="mountain"}'
        values: '13x300'
      - series: 'mountain_unmapped_total{namespace="mountain", kind="app"}'
        values: '0x60 1x200'
      - series: 'mountain_unmapped_total{namespace="other", kind="node"}'
        values: '5x300'
      # the town: 12 buildings, then an empty town from 10m (a broken pods query after a fresh start)
      - series: 'mountain_plots{namespace="mountain"}'
        values: '12x40 0x200'
    alert_rule_test:
      - eval_time: 4m
        alertname: MountainSourceStale
        exp_alerts: []
      - eval_time: 6m
        alertname: MountainSourceStale
        exp_alerts:
          - exp_labels: { severity: notice, source: alerts }
            exp_annotations:
              summary: "mountain: a relay source has not polled successfully for 5 min"
              description: 'prom/alerts: the live page shows "stale since"; the relay keeps serving the last town. db: the page stays live, but frames and snapshots are not stored (restart survival, scrub); unset DATABASE_URL (memory-only) looks the same. Check the relay logs for the source label.'
          - exp_labels: { severity: notice, source: db }
            exp_annotations:
              summary: "mountain: a relay source has not polled successfully for 5 min"
              description: 'prom/alerts: the live page shows "stale since"; the relay keeps serving the last town. db: the page stays live, but frames and snapshots are not stored (restart survival, scrub); unset DATABASE_URL (memory-only) looks the same. Check the relay logs for the source label.'
      - eval_time: 50m
        alertname: MountainTokenExpiring
        exp_alerts: []
      - eval_time: 61m
        alertname: MountainTokenExpiring
        exp_alerts:
          - exp_labels: { severity: notice }
            exp_annotations:
              summary: "mountain: the GitHub token expires in under 14 days"
              description: Rotate the token in Infisical (mountain-8c-cz) before the builds (scaffolds) go dark.
      - eval_time: 40m
        alertname: MountainUnmapped
        exp_alerts: []
      - eval_time: 46m
        alertname: MountainUnmapped
        exp_alerts:
          - exp_labels: { severity: notice, kind: app }
            exp_annotations:
              summary: "mountain: series dropped for lack of a relay/config.yaml map entry"
              description: A new app, node, repo or namespace is not in relay/config.yaml, so it is missing from the town. Add it to the static maps (02 rot guard).
      - eval_time: 24m
        alertname: MountainTownEmpty
        exp_alerts: []
      - eval_time: 26m
        alertname: MountainTownEmpty
        exp_alerts:
          - exp_labels: { severity: notice }
            exp_annotations:
              summary: "mountain: the town has no building"
              description: >-
                mountain_plots has been 0 for 15 min: the page shows empty islands. Check the relay log for
                "optional query pods failed" and mountain_query_failed_total{query="pods"}.
