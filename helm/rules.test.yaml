# promtool unit tests for the PrometheusRule in helm/values.yaml extraManifests.
# Run by rules_test.go, which extracts the rules (namespace "mountain") to rules.yaml next to a copy of this file.
rule_files: [rules.yaml]
evaluation_interval: 15s
tests:
  - interval: 15s
    input_series:
      # prom polls fine (the gauge follows the clock); alerts never succeeded: seeded at start (t=0) and stuck
      - series: 'mountain_source_last_success{namespace="mountain", source="prom"}'
        values: '0+15x40'
      - series: 'mountain_source_last_success{namespace="mountain", source="alerts"}'
        values: '0+0x40'
      # memory-only (DATABASE_URL unset): seeded at start, never refreshed
      - series: 'mountain_source_last_success{namespace="mountain", source="db"}'
        values: '0+0x40'
      - series: 'mountain_github_token_days_left{namespace="mountain"}'
        values: '13x300'
      # a component appears that realms.yaml does not place (after 10 min); another namespace's never counts
      - series: 'mountain_drift{namespace="mountain", kind="unassigned"}'
        values: '0x40 1x300'
      - series: 'mountain_drift{namespace="mountain", kind="unresolved"}'
        values: '11x340'
      - series: 'mountain_drift{namespace="other", kind="unassigned"}'
        values: '5x340'
    alert_rule_test:
      - eval_time: 4m
        alertname: MountainSourceStale
        exp_alerts: []
      - eval_time: 6m
        alertname: MountainSourceStale
        exp_alerts:
          - exp_labels: { severity: notice, source: alerts }
            exp_annotations:
              summary: "mountain: an atlas source has not succeeded for 5 min"
              description: 'prom/alerts: the map says the source is not answering and keeps its last answer. github/projection: the map keeps its last projection; the log says whether GitHub refused the token or a round was refused for a repo it could not read. db: no history is stored; unset DATABASE_URL (memory-only) looks the same. Check the atlas log for the source label.'
          - exp_labels: { severity: notice, source: db }
            exp_annotations:
              summary: "mountain: an atlas source has not succeeded for 5 min"
              description: 'prom/alerts: the map says the source is not answering and keeps its last answer. github/projection: the map keeps its last projection; the log says whether GitHub refused the token or a round was refused for a repo it could not read. db: no history is stored; unset DATABASE_URL (memory-only) looks the same. Check the atlas log for the source label.'
      - eval_time: 50m
        alertname: MountainTokenExpiring
        exp_alerts: []
      - eval_time: 61m
        alertname: MountainTokenExpiring
        exp_alerts:
          - exp_labels: { severity: notice }
            exp_annotations:
              summary: "mountain: the GitHub token expires in under 14 days"
              description: Rotate the token in Infisical (mountain-8c-cz) before the repo poll stops; the map then keeps its last projection.
      - eval_time: 65m
        alertname: MountainUnassigned
        exp_alerts: []
      - eval_time: 71m
        alertname: MountainUnassigned
        exp_alerts:
          - exp_labels: { severity: notice }
            exp_annotations:
              summary: "mountain: a component is not in realms.yaml"
              description: The latest projection holds a component internal/realms/realms.yaml does not place, so it is on no island. Add it there (the map's drift list names it).
