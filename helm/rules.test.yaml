# promtool unit tests for the PrometheusRule in helm/values.yaml extraManifests.
# Run by rules_test.go, which extracts the rules (namespace "mountain") to rules.yaml next to a copy of this file.
rule_files: [rules.yaml]
evaluation_interval: 15s
tests:
  - interval: 15s
    input_series:
      # prom polls fine (the gauge follows the clock); alerts never succeeded: seeded at start (t=0) and stuck
      - series: 'mountain_source_last_success{namespace="mountain", source="prom"}'
        values: '0+15x40'
      - series: 'mountain_source_last_success{namespace="mountain", source="alerts"}'
        values: '0+0x40'
      # the tag loop never gets proof from the bridge, and its Applications list never succeeds: seeded, never renewed
      - series: 'mountain_source_last_success{namespace="mountain", source="bridge-tags"}'
        values: '0+0x40'
      - series: 'mountain_source_last_success{namespace="mountain", source="bridge-apps"}'
        values: '0+0x40'
      # memory-only (DATABASE_URL unset): seeded at start, never refreshed
      - series: 'mountain_source_last_success{namespace="mountain", source="db"}'
        values: '0+0x40'
      # a component appears that realms.yaml does not place (after 10 min); another namespace's never counts
      - series: 'mountain_drift{namespace="mountain", kind="unassigned"}'
        values: '0x40 1x300'
      - series: 'mountain_drift{namespace="mountain", kind="unresolved"}'
        values: '11x340'
      - series: 'mountain_drift{namespace="other", kind="unassigned"}'
        values: '5x340'
    alert_rule_test:
      - eval_time: 4m
        alertname: MountainSourceStale
        exp_alerts: []
      - eval_time: 6m
        alertname: MountainSourceStale
        exp_alerts:
          - exp_labels: { severity: notice, source: alerts }
            exp_annotations:
              summary: "mountain: an atlas source has not succeeded for 5 min"
              description: 'prom/alerts: the map says the source is not answering and keeps its last answer. bridge-tags: the System tag loop is off (the log says which ATLAS_BRIDGE_* is missing) or the bridge has not answered it for minutes (token refused, bridge down or wedged). bridge-apps: the Applications list the tags resolve against fails (atlas''s read grant on ArgoCD''s Applications, infra-bootstrap gitops/platform/mountain, is missing, or the apiserver errors). forge/projection: the map keeps its last projection; the log says whether Forgejo refused the token, the token is unset (MOUNTAIN_FORGE_TOKEN) or a round was refused for a repo it could not read. db: no history is stored; unset DATABASE_URL (memory-only) looks the same. Check the atlas log for the source label.'
          - exp_labels: { severity: notice, source: bridge-apps }
            exp_annotations:
              summary: "mountain: an atlas source has not succeeded for 5 min"
              description: 'prom/alerts: the map says the source is not answering and keeps its last answer. bridge-tags: the System tag loop is off (the log says which ATLAS_BRIDGE_* is missing) or the bridge has not answered it for minutes (token refused, bridge down or wedged). bridge-apps: the Applications list the tags resolve against fails (atlas''s read grant on ArgoCD''s Applications, infra-bootstrap gitops/platform/mountain, is missing, or the apiserver errors). forge/projection: the map keeps its last projection; the log says whether Forgejo refused the token, the token is unset (MOUNTAIN_FORGE_TOKEN) or a round was refused for a repo it could not read. db: no history is stored; unset DATABASE_URL (memory-only) looks the same. Check the atlas log for the source label.'
          - exp_labels: { severity: notice, source: bridge-tags }
            exp_annotations:
              summary: "mountain: an atlas source has not succeeded for 5 min"
              description: 'prom/alerts: the map says the source is not answering and keeps its last answer. bridge-tags: the System tag loop is off (the log says which ATLAS_BRIDGE_* is missing) or the bridge has not answered it for minutes (token refused, bridge down or wedged). bridge-apps: the Applications list the tags resolve against fails (atlas''s read grant on ArgoCD''s Applications, infra-bootstrap gitops/platform/mountain, is missing, or the apiserver errors). forge/projection: the map keeps its last projection; the log says whether Forgejo refused the token, the token is unset (MOUNTAIN_FORGE_TOKEN) or a round was refused for a repo it could not read. db: no history is stored; unset DATABASE_URL (memory-only) looks the same. Check the atlas log for the source label.'
          - exp_labels: { severity: notice, source: db }
            exp_annotations:
              summary: "mountain: an atlas source has not succeeded for 5 min"
              description: 'prom/alerts: the map says the source is not answering and keeps its last answer. bridge-tags: the System tag loop is off (the log says which ATLAS_BRIDGE_* is missing) or the bridge has not answered it for minutes (token refused, bridge down or wedged). bridge-apps: the Applications list the tags resolve against fails (atlas''s read grant on ArgoCD''s Applications, infra-bootstrap gitops/platform/mountain, is missing, or the apiserver errors). forge/projection: the map keeps its last projection; the log says whether Forgejo refused the token, the token is unset (MOUNTAIN_FORGE_TOKEN) or a round was refused for a repo it could not read. db: no history is stored; unset DATABASE_URL (memory-only) looks the same. Check the atlas log for the source label.'
      - eval_time: 65m
        alertname: MountainUnassigned
        exp_alerts: []
      - eval_time: 71m
        alertname: MountainUnassigned
        exp_alerts:
          - exp_labels: { severity: notice }
            exp_annotations:
              summary: "mountain: a component is not in realms.yaml"
              description: The latest projection holds a component realms/realms.yaml does not place, so it is on no island. Add it there (the map's drift list names it).
