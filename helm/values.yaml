# mountain on infra-bootstrap's common-app-chart (ADR-0001). Read by ArgoCD through
# infra-bootstrap gitops/apps/registry.yaml (`valuesPath: [helm/values.yaml]`, W1a lane D),
# which also sets ingress.hostname: mountain.bnei.dev. Modelled on hq app/helm/values.yaml.

# One relay owns the world (06): never two writers, never a rolling overlap.
replicaCount: 1
strategy:
  type: Recreate

image:
  repository: registry.bnei.lan:5000/mountain
  # Bumped by .github/workflows/app.yml to the commit's short SHA.
  #
  # `unreleased` is a placeholder that fails loudly. The registry entry in
  # infra-bootstrap belongs after this repo's first CI run has replaced this
  # line, or the first sync is an ImagePullBackOff against a tag that was
  # never built (hq/wird have the same rule).
  tag: "30373442e6bd"

service:
  port: 8080
  # :9090 /metrics for the in-cluster ServiceMonitor only. The IngressRoute
  # routes service.port alone, so this port is never public (06).
  extraPorts:
    - name: metrics
      port: 9090

# Public page: no forwardAuth. The chart's baseline (origin lock, rate limit,
# headers) stays on (infra-bootstrap ADR-0053 Decision 5). CSP is set by the
# Go relay, where a test pins it. Traefik overwrites the backend's
# Referrer-Policy, so it is set here to match the relay's.
ingress:
  baseline:
    headers:
      referrerPolicy: no-referrer

# DATABASE_URL (mountaindb on pg-proxmox, direct :5432), rendered by infra-bootstrap
# gitops/bootstrap/mountain-secret.yaml. optional: a missing Secret starts the relay
# memory-only (logged) instead of CreateContainerConfigError; the alarm is
# mountain_source_last_success{source="db"} ageing into MountainSourceStale.
envFrom:
  - secretRef:
      name: mountain-config
      optional: true

# Alert fp salt (02: never rotated, veins link to it): key MOUNTAIN_FP_SALT in
# Infisical mountain-8c-cz, synced to the Secret mountain-infisical and loaded
# verbatim via envFrom. Without the key the relay boots and drops alerts (fail closed).
infisical:
  enabled: true
  projectSlug: mountain-8c-cz
  envSlug: dev
  autoReload: true

livenessProbe:
  enabled: true
  path: /healthz
readinessProbe:
  enabled: true
  path: /healthz

# distroless static:nonroot runs as 65532. Nothing writes to disk: state lives in
# Postgres (DATABASE_URL above).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# common-app-chart has no ServiceMonitor or PrometheusRule template; Prometheus'
# serviceMonitorSelectorNilUsesHelmValues is false and ruleSelector is {}, so both
# are picked up (same pattern as platform/values/zot, netbird). Rules (06): all
# severity notice -> Discord (the default route). Never warning|critical (routed to
# thot) and never info: the chart's InfoInhibitor inhibits every severity="info"
# alert whose namespace has no warning, so info never reaches Discord. Unit test:
# rules_test.go (promtool test rules helm/rules.test.yaml when promtool is on PATH).
# No {{ $labels }} in annotations: extraManifests go through Helm tpl.
extraManifests:
  - |
    apiVersion: monitoring.coreos.com/v1
    kind: ServiceMonitor
    metadata:
      name: mountain
      namespace: {{ .Release.Namespace }}
      labels:
        {{- include "common-app-chart.labels" . | nindent 8 }}
    spec:
      selector:
        matchLabels:
          {{- include "common-app-chart.selectorLabels" . | nindent 10 }}
      endpoints:
        - port: metrics
          path: /metrics
          interval: 15s
  - |
    apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: mountain
      namespace: {{ .Release.Namespace }}
      labels:
        {{- include "common-app-chart.labels" . | nindent 8 }}
    spec:
      groups:
        - name: mountain
          rules:
            # A source that never succeeds ages from relay start (the relay seeds the gauge).
            - alert: MountainSourceStale
              expr: time() - max by (source) (mountain_source_last_success{namespace="{{ .Release.Namespace }}"}) > 180
              for: 2m
              labels:
                severity: notice
              annotations:
                summary: "mountain: a relay source has not polled successfully for 5 min"
                description: >-
                  prom/alerts: the live page shows "stale since" and the sky dims; the relay
                  keeps serving the last world. db: the page stays live, but frames and
                  snapshots are not stored (restart survival, scrub); unset DATABASE_URL
                  (memory-only) looks the same. Check the relay logs for the source label.
            - alert: MountainTokenExpiring
              expr: min(mountain_github_token_days_left{namespace="{{ .Release.Namespace }}"}) < 14
              for: 1h
              labels:
                severity: notice
              annotations:
                summary: "mountain: the GitHub token expires in under 14 days"
                description: Rotate the token in Infisical (mountain-8c-cz) before builds and commits go dark.
            - alert: MountainUnmapped
              expr: max by (kind) (mountain_unmapped_total{namespace="{{ .Release.Namespace }}"}) > 0
              for: 30m
              labels:
                severity: notice
              annotations:
                summary: "mountain: series dropped for lack of a relay/config.yaml map entry"
                description: >-
                  A new app, node, repo or namespace is not in relay/config.yaml, so it is
                  missing from the mountain. Add it to the static maps (02 rot guard).
