# mountain on infra-bootstrap's common-app-chart (ADR-0001). Read by ArgoCD through
# infra-bootstrap gitops/apps/registry.yaml (`valuesPath: [helm/values.yaml]`, W1a lane D),
# which also sets ingress.hostname: mountain.bnei.dev. Modelled on hq app/helm/values.yaml.

# One atlas (R10 A2, plan/10): one projector and one poll, never two writers, never a rolling overlap.
replicaCount: 1
strategy:
  type: Recreate

image:
  repository: registry.bnei.lan:5000/mountain
  # Bumped by .github/workflows/app.yml to the commit's short SHA.
  #
  # `unreleased` is a placeholder that fails loudly. The registry entry in
  # infra-bootstrap belongs after this repo's first CI run has replaced this
  # line, or the first sync is an ImagePullBackOff against a tag that was
  # never built (hq/wird have the same rule).
  tag: "9d82f8224ecc"

service:
  port: 8080
  # :9090 /metrics for the in-cluster ServiceMonitor only. The IngressRoute
  # routes service.port alone, so this port is never public (06).
  extraPorts:
    - name: metrics
      port: 9090

# Gated (infra-bootstrap ADR-0065): the whole site sits behind authentik
# forwardAuth, Middleware/mountain-forwardauth (namespace default, declared in
# infra-bootstrap with its `mountain-gate` provider: platform-admins only since
# R10). The chart appends it after the baseline (origin lock, rate limit,
# headers), which stays on (ADR-0053 Decision 5). atlas trusts no forwarded
# header: its own OIDC sign-in admits platform-admins only and every route but
# /healthz and /auth/* refuses anyone else (cmd/atlas, deny by default). Revert
# this ref before infra-bootstrap's Middleware, or the route errors (404). CSP
# is set by atlas, where a test pins it. Traefik overwrites the backend's
# Referrer-Policy, so it is set here to match.
ingress:
  middlewares:
    - name: mountain-forwardauth
      namespace: default
  baseline:
    headers:
      referrerPolicy: no-referrer

# DATABASE_URL (mountaindb on pg-proxmox, direct :5432), rendered by infra-bootstrap
# gitops/bootstrap/mountain-secret.yaml: the projection history (cmd/atlas/migrations,
# its own series; the first one drops the town's tables). optional: a missing Secret
# starts atlas memory-only (the latest projection, no history; logged) instead of
# CreateContainerConfigError; the alarm is mountain_source_last_success{source="db"}
# ageing into MountainSourceStale.
envFrom:
  - secretRef:
      name: mountain-config
      optional: true
  # Sign-in: MOUNTAIN_OIDC_ISSUER, MOUNTAIN_OIDC_CLIENT_ID, MOUNTAIN_OIDC_CLIENT_SECRET,
  # MOUNTAIN_SESSION_KEY, rendered by infra-bootstrap gitops/bootstrap/mountain-oidc-secret.yaml.
  # optional: without it atlas starts and refuses every route but /healthz (logged).
  # Env is bound at start: restart the pod after a rotation.
  - secretRef:
      name: mountain-oidc
      optional: true
  # The game's machine principal (cmd/atlas/machine.go, infra-bootstrap ADR-0068):
  # MOUNTAIN_MACHINE_CERT (authentik's signing certificate, PEM), _ISSUER, _CLIENT_ID (the
  # atlas-api provider's) and _SUB (atlas-game). None is secret. Unset until the game is
  # deployed: the bearer path stays off. All or none: some set and atlas refuses to start.

# MOUNTAIN_GITHUB_TOKEN (Infisical mountain-8c-cz, synced to the Secret mountain-infisical
# and loaded verbatim via envFrom): the read-only token atlas polls the repos with (contents
# + metadata read on infra-bootstrap and the realms.yaml sources; a repo it cannot read is
# left out and logged). Unset = no poll: atlas serves the stored projection only. A5's
# ukubi-atlas App replaces it. Env is bound at start: restart the pod after a rotation.
# MOUNTAIN_FP_SALT and VISITORS_ENABLED were the town's; atlas reads neither.
infisical:
  enabled: true
  projectSlug: mountain-8c-cz
  envSlug: dev
  autoReload: false

# The repo trees atlas reads (fetch.go): a cache, never state, so an emptyDir with a
# size limit (plan/10 Security, Runtime). The root filesystem stays read-only.
extraVolumes:
  - name: cache
    emptyDir:
      sizeLimit: 6Gi # fetch.go's cacheBudget (4 GiB) plus headroom
extraVolumeMounts:
  - name: cache
    mountPath: /var/cache/atlas

# Explicit, because the chart's LimitRange default (512Mi) is below what a round
# may need: the extractors hold every source's YAML at once (plan/10 Security,
# Runtime). Measured 2026-10-30 with `atlas --repos ~/Code/ukubi` over 15 of the 17
# sources (vos-monolith included): peak RSS 68 MiB, so 1536Mi keeps wide headroom
# and the per-repo YAML stream (B3 plan risk) is not needed yet.
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 1536Mi

livenessProbe:
  enabled: true
  path: /healthz
readinessProbe:
  enabled: true
  path: /healthz

# distroless static:nonroot runs as 65532. Nothing writes to disk but the cache
# above: state lives in Postgres (DATABASE_URL above).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# common-app-chart has no ServiceMonitor or PrometheusRule template; Prometheus'
# serviceMonitorSelectorNilUsesHelmValues is false and ruleSelector is {}, so both
# are picked up (same pattern as platform/values/zot, netbird). Rules: all
# severity notice -> Discord (the default route). Never warning|critical (routed to
# thot) and never info: the chart's InfoInhibitor inhibits every severity="info"
# alert whose namespace has no warning, so info never reaches Discord. Unit test:
# rules_test.go (promtool test rules helm/rules.test.yaml when promtool is on PATH).
# No {{ $labels }} in annotations: extraManifests go through Helm tpl.
extraManifests:
  - |
    apiVersion: monitoring.coreos.com/v1
    kind: ServiceMonitor
    metadata:
      name: mountain
      namespace: {{ .Release.Namespace }}
      labels:
        {{- include "common-app-chart.labels" . | nindent 8 }}
    spec:
      selector:
        matchLabels:
          {{- include "common-app-chart.selectorLabels" . | nindent 10 }}
      endpoints:
        - port: metrics
          path: /metrics
          interval: 15s
  - |
    apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: mountain
      namespace: {{ .Release.Namespace }}
      labels:
        {{- include "common-app-chart.labels" . | nindent 8 }}
    spec:
      groups:
        - name: mountain
          rules:
            # A source that never succeeds ages from start (atlas seeds the gauge): prom, alerts, github and
            # projection (only while the repo poll runs) and db.
            - alert: MountainSourceStale
              expr: time() - max by (source) (mountain_source_last_success{namespace="{{ .Release.Namespace }}"}) > 180
              for: 2m
              labels:
                severity: notice
              annotations:
                summary: "mountain: an atlas source has not succeeded for 5 min"
                description: >-
                  prom/alerts: the map says the source is not answering and keeps its last answer. github/projection:
                  the map keeps its last projection; the log says whether GitHub refused the token or a round was
                  refused for a repo it could not read. db: no history is stored; unset DATABASE_URL (memory-only)
                  looks the same. Check the atlas log for the source label.
            - alert: MountainTokenExpiring
              expr: min(mountain_github_token_days_left{namespace="{{ .Release.Namespace }}"}) < 14
              for: 1h
              labels:
                severity: notice
              annotations:
                summary: "mountain: the GitHub token expires in under 14 days"
                description: Rotate the token in Infisical (mountain-8c-cz) before the repo poll stops; the map then keeps its last projection.
            # A component the repos now have that realms.yaml does not place: it shows as drift, not on an island.
            - alert: MountainUnassigned
              expr: max(mountain_drift{namespace="{{ .Release.Namespace }}", kind="unassigned"}) > 0
              for: 1h
              labels:
                severity: notice
              annotations:
                summary: "mountain: a component is not in realms.yaml"
                description: >-
                  The latest projection holds a component realms/realms.yaml does not place, so it is on no
                  island. Add it there (the map's drift list names it).
