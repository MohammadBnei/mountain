# promtool unit test of promQ "pods" (src_prom.go), run by TestPodsQuery: the rule file is built from promQ itself.
# Two KSM replicas must not break the join; deleted, Pending and unscheduled pods are not running anywhere.
rule_files: [rules.yaml]
evaluation_interval: 15s
tests:
  - interval: 15s
    input_series:
      # wird-a: two KSM replicas report it (instance differs), Running
      - series: 'kube_pod_info{namespace="wird", pod="wird-a", node="k8s-cp-01", uid="1", instance="ksm-1"}'
        values: '1x10'
      - series: 'kube_pod_info{namespace="wird", pod="wird-a", node="k8s-cp-01", uid="1", instance="ksm-2"}'
        values: '1x10'
      - series: 'kube_pod_status_phase{namespace="wird", pod="wird-a", phase="Running", instance="ksm-1"}'
        values: '1x10'
      - series: 'kube_pod_status_phase{namespace="wird", pod="wird-a", phase="Running", instance="ksm-2"}'
        values: '1x10'
      - series: 'kube_pod_status_phase{namespace="wird", pod="wird-a", phase="Pending", instance="ksm-1"}'
        values: '0x10'
      # wird-b: Running but being deleted (its node went NotReady)
      - series: 'kube_pod_info{namespace="wird", pod="wird-b", node="k8s-cp-02", uid="2"}'
        values: '1x10'
      - series: 'kube_pod_status_phase{namespace="wird", pod="wird-b", phase="Running"}'
        values: '1x10'
      - series: 'kube_pod_deletion_timestamp{namespace="wird", pod="wird-b"}'
        values: '1760000000x10'
      # wird-c: Pending
      - series: 'kube_pod_info{namespace="wird", pod="wird-c", node="k8s-cp-03", uid="3"}'
        values: '1x10'
      - series: 'kube_pod_status_phase{namespace="wird", pod="wird-c", phase="Running"}'
        values: '0x10'
      # unscheduled: no node
      - series: 'kube_pod_info{namespace="wird", pod="wird-d", node="", uid="4"}'
        values: '1x10'
      - series: 'kube_pod_status_phase{namespace="wird", pod="wird-d", phase="Running"}'
        values: '1x10'
    promql_expr_test:
      - expr: town:pods
        eval_time: 1m
        exp_samples:
          - labels: 'town:pods{namespace="wird", pod="wird-a", node="k8s-cp-01"}'
            value: 1
