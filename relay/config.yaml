# Static relay config (02-data "Static relay config"). Orchestrator-owned.
# Rot guard: mountain_unmapped_total{kind} + a CI diff against
# infra-bootstrap gitops/apps/registry.yaml (W1a lane A/D).
#
# Built by allowlist, never by deletion: anything not listed here reaches the
# public wire only as the "other" aggregate, with no site and no name.

# Public app allowlist (registry.yaml, 2026-10-14). group: platform|user|service; building: a town kind
# (relay/town Kinds), the building the app's plot carries.
# Deliberately absent: agent-fleet-core (fleet, excluded by plan), has-journal
# (forwardAuth-gated, internal data), wird-adminweb (platform-admins only),
# hq (private dashboard).
apps:
  mountain:        { group: platform, display: mountain, building: castle }
  editable-blog:   { group: user, display: blog, building: house }
  dream-analyst:   { group: user, display: dreamer, building: tavern }
  vos-monolith:    { group: user, display: vos, building: market }
  vos-monolith-dev: { group: user, display: vos dev, building: home }
  wedding-2026:    { group: user, display: wedding, building: church }
  ukubi-stt:       { group: platform, display: stt, building: tower }
  wird:            { group: user, display: wird, building: house }
  # Platform services (R7, user decision "full services"): public under a generic ROLE key only, never the
  # product name (a sanitize test greps every frame for the names). They flow like apps: syncs, health, churn,
  # Traefik traffic, pools, and a building on the host their pods run on. Amends ADR-0056 (plan/adr-0056-amendment.md).
  gate:            { group: service, display: gate, building: gate }             # traefik
  guardhouse:      { group: service, display: guardhouse, building: guardhouse } # authentik
  craneyard:       { group: service, display: crane yard, building: craneyard }  # argocd
  watchtower:      { group: service, display: watchtower, building: watchtower } # monitoring
  warehouse:       { group: service, display: warehouse, building: warehouse }   # longhorn
  vault:           { group: service, display: vault, building: vault }           # infisical
  granary:         { group: service, display: granary, building: granary }       # garage
  depot:           { group: service, display: depot, building: depot }           # zot

# namespace (or namespace/deployment, which wins) -> app. "" = known but not
# public: dropped into "other" without counting as unmapped.
namespaces:
  mountain: mountain
  editable-blog: editable-blog
  dream-analyst: dream-analyst
  vos: vos-monolith
  vos-dev: vos-monolith-dev
  wedding-2026: wedding-2026
  ukubi-stt: ukubi-stt
  wird: wird
  wird/wird-adminweb: ""
  has-journal: ""
  hq: ""
  agent-fleet: ""
  # Platform and third-party namespaces (argocd_app_info dest_namespace and Traefik
  # routers, live 2026-10-14): known, not rot. The ones mapped to a role key are public services (R7);
  # "" stays private.
  actions-runner: ""
  argocd: craneyard
  authentik: guardhouse
  default: ""
  ente: ""
  garage: granary
  infisical: vault
  kube-system: ""
  local-path-storage: ""
  longhorn-system: warehouse
  monitoring: watchtower
  netbird: ""
  pgweb: ""
  proxmox: ""
  searxng: ""
  thot: ""
  traefik: gate
  zot: depot

# Kubernetes node -> Proxmox host bucket (terraform.tfvars k8s_nodes node_name).
# h1 = the .165 PVE node (default pve_node_name), h2 = server1, h3 = ex-laptop.
nodes:
  k8s-cp-01: h1
  k8s-worker-01: h1
  k8s-cp-02: h2
  k8s-worker-02: h2
  k8s-cp-03: h3
  # PVE blackbox probe targets (probe_success{target}) -> same host buckets.
  pve-bnei: h1
  pve-server1: h2
  pve-ex-laptop: h3

# Alert -> stratum layer, first match on alertname (Go regexp, anchored).
# Layers: bedrock (Proxmox/hosts), k8s (cluster), apps.
alertLayers:
  - { match: "Node.*|PVE.*|Proxmox.*|Host.*|Probe.*", layer: bedrock }
  - { match: "Kube.*|Etcd.*|CoreDNS.*|Cilium.*|Longhorn.*|Prometheus.*|Alertmanager.*|ArgoCD.*|Traefik.*", layer: k8s }
  - { match: ".*", layer: apps }

# GitHub repo -> app (builds, W3).
repos:
  MohammadBnei/mountain: mountain
  MohammadBnei/editable-blog: editable-blog
  MohammadBnei/dream-analyst: dream-analyst
  MohammadBnei/vos-monolith: vos-monolith
  MohammadBnei/wedding-2026: wedding-2026
  MohammadBnei/ukubi-stt: ukubi-stt
  MohammadBnei/wird: wird

# Public commit/ADR titles (Go regexp, anchored). Everything else is date only.
titles: []
