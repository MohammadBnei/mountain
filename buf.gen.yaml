# Go code for api/, committed (app.yml checks it matches). The plugins are pinned by module version; `go run` builds
# them from the module cache. Run: buf generate
version: v2
plugins:
  - local: ["go", "run", "google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12"]
    out: api
    opt: paths=source_relative
  - local: ["go", "run", "connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.21.1"]
    out: api
    opt: paths=source_relative
