# atlas's curated map (plan/10-understanding.md "Realms are curated"). Nothing in the repos carries a realm, so this
# file says it, plainly. Every component atlas extracts must be listed here: one that isn't becomes an "unassigned"
# drift node, and internal/extract's tests fail on it. It moves into the service registry once one exists.

# The seven realms, in L0 order. Since R12 (plan/13) they are the game's civs too: groups of elements of the same
# category. code holds the repos: atlas places them itself (by the realms of the apps they feed), never listed here.
realms: [platform, data, operations, guard, fleet, apps, code]

# What a group does in play (plan/13 §1 Functions), by realm/group; a component may override it with function:.
# land is the hardware (hosts): drawn in atlas, never a building in the game. The repos' workshop is set by atlas.
functions:
  platform/hosts: land
  platform/nodes: houses
  platform/storage: utility
  platform/gpu: utility
  platform/edge: utility
  platform/metrics: utility
  platform/network: utility
  data/postgres: economy
  data/redis: economy
  data/s3: economy
  data/nfs: economy
  operations/delivery: trade
  operations/build: trade
  operations/observability: trade
  operations/events: trade
  operations/atlas: town-centre
  guard/authentik: defence
  guard/secrets: defence
  guard/mesh: defence
  fleet/control: barracks
  fleet/cluster-access: barracks
  fleet/hermes: barracks
  fleet/session-pod: barracks
  apps/sites: product
  apps/products: product
  apps/ai: product
  apps/tools: product

# Proxmox hosts (the land) and their island labels.
hosts:
  bnei: h1
  server1: h2
  ex-laptop: h3

# terraform var.pve_node_name: its value lives in the uncommitted tfvars (terraform/variables.tf, "likely bnei").
pveNodeName: bnei

# k8s VM -> Proxmox host. terraform's real k8s_nodes map is in the uncommitted tfvars, and the committed
# inventory/ukubi/hosts.yaml names the nodes but not their host. (The town's relay/config.yaml carried the same buckets.)
k8sPlacement:
  k8s-cp-01: bnei
  k8s-worker-01: bnei
  k8s-cp-02: server1
  k8s-worker-02: server1
  k8s-cp-03: ex-laptop

# Where a repo with no docs/adr of its own sends a bare "ADR-NNNN".
adrHome:
  mountain: infra-bootstrap
  ukubi-bridge: infra-bootstrap

# Where a bare "adr/NNNN" points. It is agent-fleet's own shorthand (its CLAUDE.md), and infra-bootstrap uses it for
# agent-fleet's ADRs; any other repo means its own (pi-lab writes `adr/0001`).
shortADR:
  agent-fleet: agent-fleet
  infra-bootstrap: agent-fleet

# Vendored or generated directories, by repo-relative path: their citations are not the repo's. node_modules,
# vendor and testdata are skipped everywhere, and submodules are read (if at all) as their own repo.
skip:
  infra-bootstrap: [kubespray, pigsty/conf, pigsty/roles]
  agent-fleet: [proto/gen, core/proto/gen, dashboard/src/gen, dashboard/dist, core/internal/webui/dist, core/internal/islands/dist]
  ukubi-bridge: [proto/gen]

# The repos atlas fetches and reads (A2's poll): infra-bootstrap first, since its registry names the branch each of
# the others is read at. An app repo outside this list is a git edge only: no extractor reads its files yet.
sources: [infra-bootstrap, agent-fleet, ukubi-bridge, mountain, pi-lab]

# blackbox probe targets -> the node they probe (infra-bootstrap ADR-0064). pve-<host> targets map to host:<host>
# by name; the guest-<role> names are the town's old role keys, so they are listed. k9s-dashboard is never probed.
probes:
  guest-archive-h1: vm:pg02
  guest-archive-h2: vm:pg01
  guest-witness: vm:pg-etcd-witness
  guest-granary: ct:garage-storage
  guest-cellar: vm:nfs-storage
  guest-forge: ct:build-runner
  guest-mill: ct:hermesagent

# Namespaces no ArgoCD Application deploys into, but whose pods belong to a realm (the land lens): kubespray installs
# Cilium, CoreDNS and the like straight into kube-system. A namespace in neither list counts as "unattributed".
namespaces:
  kube-system: platform
  metallb-system: platform

# Components: id -> realm and group (the L1 fold key). paths (repo-relative prefixes, "<repo>/<prefix>") attach the
# ADR citations found under them to this component (governs edges); a citation under no listed path goes to its repo.
components:
  # Platform: the land (hosts, a lens in the game), the nodes, and the cluster's utilities
  host:bnei: { realm: platform, group: hosts }
  host:server1: { realm: platform, group: hosts }
  host:ex-laptop: { realm: platform, group: hosts }
  vm:k8s-cp-01: { realm: platform, group: nodes }
  vm:k8s-cp-02: { realm: platform, group: nodes }
  vm:k8s-cp-03: { realm: platform, group: nodes }
  vm:k8s-worker-01: { realm: platform, group: nodes }
  vm:k8s-worker-02: { realm: platform, group: nodes }
  app:platform-longhorn: { realm: platform, group: storage }
  app:platform-local-path-provisioner: { realm: platform, group: storage }
  app:platform-csi-driver-nfs: { realm: platform, group: storage }
  app:platform-nvidia-device-plugin: { realm: platform, group: gpu }
  app:platform-traefik: { realm: platform, group: edge }
  app:redirectors: { realm: platform, group: edge }
  addon:cilium: { realm: platform, group: network }
  addon:kube-proxy: { realm: platform, group: network }
  addon:coredns: { realm: platform, group: network }
  addon:nodelocaldns: { realm: platform, group: network }
  addon:metallb: { realm: platform, group: network }
  addon:kube-vip: { realm: platform, group: network }
  app:platform-metrics-server: { realm: platform, group: metrics } # kube-system, with the add-ons: HPA plumbing, not observability

  # Data: the stores
  vm:nfs-storage: { realm: data, group: nfs }
  db:pg-proxmox: { realm: data, group: postgres }
  vm:pg01: { realm: data, group: postgres, parent: db:pg-proxmox }
  vm:pg02: { realm: data, group: postgres, parent: db:pg-proxmox }
  vm:pg-etcd-witness: { realm: data, group: postgres, parent: db:pg-proxmox }
  db:redis-main: { realm: data, group: redis }
  ct:garage-storage: { realm: data, group: s3 }

  # Operations: deliver, build, observe, the events bridge, and atlas (the game's town centre)
  ct:build-runner: { realm: operations, group: build }
  app:platform-actions-runner: { realm: operations, group: build }
  app:argocd: { realm: operations, group: delivery }
  app:bootstrap: { realm: operations, group: delivery }
  app:zot: { realm: operations, group: delivery }
  app:platform-prometheus: { realm: operations, group: observability }
  app:platform-grafana: { realm: operations, group: observability }
  app:platform-loki: { realm: operations, group: observability }
  app:platform-alloy: { realm: operations, group: observability }
  app:platform-blackbox-exporter: { realm: operations, group: observability, function: defence }
  app:mountain: { realm: operations, group: atlas, paths: [mountain/] }
  app:ukubi-bridge: { realm: operations, group: events, paths: [ukubi-bridge/] }

  # Guard: identity, secrets, the mesh
  app:platform-authentik: { realm: guard, group: authentik }
  app:platform-infisical: { realm: guard, group: secrets }
  app:platform-infisical-operator: { realm: guard, group: secrets }
  app:agent-vault: { realm: guard, group: secrets }
  app:netbird: { realm: guard, group: mesh }
  app:netbird-dashboard: { realm: guard, group: mesh }

  # Fleet
  app:agent-fleet-core: { realm: fleet, group: control }
  app:platform-provisioner: { realm: fleet, group: control }
  app:platform-thot: { realm: fleet, group: cluster-access }
  ct:hermesagent: { realm: fleet, group: hermes }
  svc:agent-fleet/core: { realm: fleet, group: control, parent: app:agent-fleet-core, paths: [agent-fleet/core/] }
  svc:agent-fleet/provisioner: { realm: fleet, group: control, parent: app:platform-provisioner, paths: [agent-fleet/provisioner/] }
  # the session pods' two containers, which the provisioner spawns, are its parts; the executor is thot's
  svc:agent-fleet/sidecar: { realm: fleet, group: session-pod, parent: app:platform-provisioner, paths: [agent-fleet/sidecar/] }
  svc:agent-fleet/worker: { realm: fleet, group: session-pod, parent: app:platform-provisioner, paths: [agent-fleet/worker/] }
  svc:agent-fleet/executor: { realm: fleet, group: cluster-access, parent: app:platform-thot, paths: [agent-fleet/executor/] }
  svc:agent-fleet/dashboard: { realm: fleet, group: control, parent: app:agent-fleet-core, paths: [agent-fleet/dashboard/] }

  # Apps: products, sites, AI, tools
  app:searxng: { realm: apps, group: tools }
  app:pgweb: { realm: apps, group: tools }
  app:silverbullet: { realm: apps, group: tools }
  app:drop: { realm: apps, group: tools }
  app:editable-blog: { realm: apps, group: sites }
  app:wedding-2026: { realm: apps, group: sites }
  app:pi-lab: { realm: apps, group: sites, paths: [pi-lab/] }
  app:hq: { realm: apps, group: sites }
  app:dream-analyst: { realm: apps, group: products }
  app:vos-monolith: { realm: apps, group: products }
  app:vos-monolith-dev: { realm: apps, group: products }
  app:wird: { realm: apps, group: products }
  app:wird-adminweb: { realm: apps, group: products }
  app:has-journal: { realm: apps, group: products }
  app:ente-museum: { realm: apps, group: products }
  app:ente-web: { realm: apps, group: products }
  app:ukubi-stt: { realm: apps, group: ai }

# Watchtowers (plan/13 §3 Defence; owner 2026-10-26: only a rule that names a building watches it): node -> its alert
# rules, by where they are evaluated: prometheus (alert names: they reach Alertmanager, so atlas and the sim see them
# fire) or grafana (rule uids: they notify, but nothing atlas reads sees them fire). atlas checks both ways: a rule a
# row names must be declared in a source, and a declared rule must be in a row or under general. A probe with no rule
# (the guest probes) is not a watchtower: its node says so.
watch:
  app:platform-traefik: { prometheus: [TraefikCertExpiringSoon, TraefikCertMetricsMissing] }
  app:netbird: { prometheus: [NetBirdUnreachable, NetBirdServerDown] }
  app:mountain: { prometheus: [MountainSourceStale, MountainTokenExpiring, MountainUnassigned] }
  host:bnei: { prometheus: [PVEHostUnreachable, PVEHostProbeStale] }
  host:server1: { prometheus: [PVEHostUnreachable, PVEHostProbeStale] }
  host:ex-laptop: { prometheus: [PVEHostUnreachable, PVEHostProbeStale] }
  db:pg-proxmox: { grafana: [postgres-replica-not-streaming] }
  app:platform-prometheus: { grafana: [monitoring-blind] }
  app:agent-fleet-core: { grafana: [high-error-log-rate] }
  app:ukubi-bridge: { grafana: [dead-letter-uncleared, retention-failing] }
# The town's general watch: rules over every namespace at once (not a building's watchtower).
general: { grafana: [log-error-rate-spike] }

# Supply lines (plan/13 §3; owner 2026-10-26: curated, checked): node -> what it depends on, each written as the
# evidence that proves it: oidc (its OIDC client's redirect URL is one of its hostnames), forwardauth (its ingress
# names an authentik forwardAuth middleware), infisical (its values have an infisical: block), s3 (its values name
# Garage's S3 endpoint), postgres:<db> (that database is in Pigsty's pg_databases; which app owns it is this row's
# word), declared:<node> (the evidence lives outside the sources atlas reads: shown as unverified). atlas checks both
# ways: a row's evidence must be found, and evidence for an app with no row naming it is drift.
needs:
  app:mountain: [oidc, forwardauth, infisical, postgres:mountaindb]
  app:agent-fleet-core: [oidc, infisical, postgres:agentfleetdb]
  app:ukubi-bridge: [postgres:bridge]
  app:platform-authentik: [postgres:authentik]
  app:platform-infisical: [postgres:infisicaldb]
  app:netbird: [postgres:netbirddb]
  app:netbird-dashboard: [oidc]
  app:hq: [oidc, postgres:hqdb]
  app:wird: [oidc, postgres:wirddb]
  app:wird-adminweb: ["declared:app:platform-authentik"] # wird-admin-forwardauth, named in wird's own values
  app:silverbullet: [oidc]
  app:drop: ["declared:app:platform-authentik"] # drop-forwardauth, named in drop's own values
  app:redirectors: [forwardauth, s3] # hermes behind authentik; the S3 redirector is Garage's door
  app:ente-museum: [infisical, s3, postgres:entedb]
  app:ente-web: [infisical]
  app:agent-vault: [infisical]
  app:pgweb: [infisical, forwardauth]
  app:has-journal: ["declared:app:platform-authentik"] # authentik-forwardauth, named in has-journal's own values
  app:zot: [infisical, "declared:ct:garage-storage"] # its blobs on Garage, by address in its storage config
  app:editable-blog: [postgres:editableblogdb]
  app:dream-analyst: [postgres:dream_analyst_db]
  app:vos-monolith: [postgres:vos-monolith]
  app:vos-monolith-dev: [postgres:vos-monolith-dev]
  app:wedding-2026: [postgres:weddingdb]
  app:argocd: ["declared:app:platform-authentik"] # native OIDC: its hostname has no route atlas sees
  app:platform-grafana: ["declared:app:platform-authentik"] # native OIDC: its hostname has no route atlas sees

# Walls on the doors (plan/13 §3 Defence, owner 2026-10-26): what the sources can't show of a hostname's gate. The
# gates atlas reads itself need no row (a forwardAuth middleware on the route, a forward_single provider for the host,
# an OIDC redirect URL). A row says: public (meant for everyone), own (the app authenticates its own callers), or a
# gate declared because it lives in a repo atlas does not read (forwardauth: the whole host; forwardauth-path: a part
# of it; oidc). A door with nothing is open: shown, not drift. Drift: a mark on a walled door, a declared gate the
# sources show, a row on a hostname that is no door.
walls:
  dns:blog.bnei.dev: [public, forwardauth-path] # /linkedin behind authentik-forwardauth (ADR-0039 status)
  dns:wedding.bnei.dev: [public, forwardauth-path] # /admin behind authentik-forwardauth (ADR-0039 status)
  dns:dreamer.bnei.dev: [public] # ADR-0039's Public tier
  dns:searxng.bnei.dev: [public] # ADR-0039's Public tier
  dns:api.voconsteroid.com: [public] # ADR-0039's Public tier
  dns:pi-lab.bnei.dev: [public] # "Public page: no forwardAuth" (pi-lab's helm/values.yaml)
  dns:ente.bnei.dev: [own] # Ente's own accounts
  dns:api.ente.bnei.dev: [own] # Ente's own accounts
  dns:events.bnei.dev: [own] # one path, /webhook/github, signature-checked (ukubi-bridge's values)
  dns:has-journal.bnei.dev: [forwardauth] # authentik-forwardauth, named in has-journal's own values

# The add-ons' workloads (kubespray's names, in the namespace each add-on's node says it is installed into): an
# add-on's health is its least ready workload. static: a static pod (no DaemonSet or Deployment): always unknown.
addons:
  addon:cilium: [daemonset/cilium, deployment/cilium-operator, deployment/hubble-relay] # hubble is on (k8s-net-cilium.yml)
  addon:kube-proxy: [daemonset/kube-proxy]
  addon:coredns: [deployment/coredns]
  addon:nodelocaldns: [daemonset/nodelocaldns]
  addon:metallb: [deployment/controller, daemonset/speaker]
  addon:kube-vip: [static]
