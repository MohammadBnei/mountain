# test and db-test, on the podman runner only (ubuntu-latest: rootless, no sudo, no secrets). They run on a PR
# and from app.yml (workflow_call) on main, whose image job needs them: main never deploys untested code (owner
# decision, until ukubi-cd gates CD). No image build on a PR (the CI/CD split): images are CD's, built from
# reviewed main by app.yml. The trailers check lives in trailers.yml, so a title or body edit re-runs it without
# re-running these.
name: checks

on:
  workflow_call:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A newer PR push cancels the older run; app.yml's call on main never cancels, so the image's gate is never cut
# short. The check is on the PR payload, not event_name, which Forgejo reports as workflow_call inside a called
# workflow.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.pull_request && true || false }}

jobs:
  # The podman runner's job container (catthehacker act-24.04) has no Chrome, so the gate selftest below stays a
  # local pre-merge step.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true # the job container starts with an empty ~/go; the runner's cache server restores it
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # No package.json here, so the pinned Biome comes from npm (www/js and www/dev only).
      - name: biome
        run: npx --yes @biomejs/biome@2.6.4 ci .
      # rules_test.go runs `promtool test rules` (and fails, not skips, under CI without it).
      - name: promtool 3.5.0
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            X64) a=amd64 s=e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a ;;
            ARM64) a=arm64 s=173389cc42bf09c4e6e54cb53fa07a5a835d7c261e14775d2183181d6e385d1c ;;
            *) echo "::error::no promtool for $RUNNER_ARCH"; exit 1 ;;
          esac
          f="$RUNNER_TEMP/prom.tgz"
          curl -sSfL -o "$f" "https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-$a.tar.gz"
          echo "$s  $f" | sha256sum -c -
          tar -xzf "$f" -C "$RUNNER_TEMP" --strip-components=1 "prometheus-3.5.0.linux-$a/promtool"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # atlas's protos (api/, buf.yaml): lint, the committed Go code matches its generation, and no breaking change
      # against main (no Buf Schema Registry: main is the baseline; skipped until main has api/).
      - name: buf 1.75.0
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            X64) a=x86_64 s=fad1e38d6909bbb583a4da81d8c02a01046e2cd663bde7e337dd24277393764b ;;
            ARM64) a=aarch64 s=00eb190aa82df17f393e05b04889cc60a0b13b3259d336e21a87d5f23ab4fd26 ;;
            *) echo "::error::no buf for $RUNNER_ARCH"; exit 1 ;;
          esac
          f="$RUNNER_TEMP/buf"
          curl -sSfL -o "$f" "https://github.com/bufbuild/buf/releases/download/v1.75.0/buf-Linux-$a"
          echo "$s  $f" | sha256sum -c -
          chmod +x "$f"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: buf lint, generate, breaking
        run: |
          set -euo pipefail
          buf lint
          buf generate
          git diff --exit-code -- api || { echo "::error::api/: the generated code is stale, run buf generate"; exit 1; }
          test -z "$(git status --porcelain -- api)" || { echo "::error::api/: buf generate made files not committed"; exit 1; }
          git fetch --no-tags --depth=1 origin main
          if git cat-file -e FETCH_HEAD:buf.yaml 2>/dev/null; then
            buf breaking --against ".git#ref=FETCH_HEAD"
          else
            echo "::notice::main has no buf.yaml yet: nothing to break"
          fi
      - name: go vet
        run: go vet ./...
      # No .golangci config, as in agent-fleet: the defaults (errcheck, govet, ineffassign, staticcheck, unused).
      # Pinned, not latest, and built with a Go at least as new as go.mod's (v2.14.0 is built with go1.27.1, what
      # agent-fleet's go.yml pins too).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      # -race: the hub, the live state and the projector are concurrent. Under it TestRenderBounds' wall-clock
      # bound is scaled (cmd/atlas/race_on_test.go).
      - name: go test -race
        run: go test -race ./...
      # The plain build too, for the one wall-clock bound the race build scales (2 s here, 30 s raced).
      - name: TestRenderBounds, plain build
        run: go test -count=1 -run '^TestRenderBounds$' ./cmd/atlas/
      # The gate selftest needs a Chrome, which the job container lacks; it then stays a local pre-merge step (04).
      - name: www core test + gate selftest (if Chrome)
        run: |
          set -euo pipefail
          node www/dev/core.test.mjs
          CHROME="${CHROME:-$(command -v google-chrome chromium chromium-browser 2>/dev/null | head -n1 || true)}"
          if [ -n "$CHROME" ] && [ -f www/dev/gate.mjs ]; then
            CHROME="$CHROME" node www/dev/gate.mjs selftest
          else
            echo "::notice::no Chrome on this runner: run 'node www/dev/gate.mjs selftest' locally before merge (04)"
          fi

  # Persistence tests need a real Postgres: TestDB* skip without MOUNTAIN_TEST_DSN (the test job above
  # has none), so they run here, against a postgres job service reached by its host name. The image comes from
  # the ECR mirror of Docker Hub, which rate-limits the LAN's one address; the alpine tag because the debian
  # one fails to start under the podman runner (crun: memory.max, as agent-fleet's go.yml notes).
  db-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17-alpine
        env:
          POSTGRES_PASSWORD: mountain
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s --health-retries 30
    env:
      MOUNTAIN_TEST_DSN: postgres://postgres:mountain@postgres:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true # the job container starts with an empty ~/go; the runner's cache server restores it
      - name: DB tests
        run: go test -count=1 -race -run '^TestDB' -v ./cmd/atlas/ # -count=1: a restored Go cache would replay a past pass
