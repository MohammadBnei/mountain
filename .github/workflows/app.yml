# Call the shared image.yml (ukubi-ci): it builds the atlas image on the build-runner LXC, pushes it to
# the in-cluster Zot registry, and pins <sha>@<digest> in helm/image.yaml on the `deploy` branch (ArgoCD layers it over helm/values.yaml) so ArgoCD rolls it out. The bump
# (GITHUB_TOKEN) never triggers another run, and helm/** is not a trigger path, so it cannot loop either.
name: app

on:
  # push to main and workflow_dispatch only: no job here runs on a pull_request, so a PR never reaches
  # ukubi-build (the CI/CD split). PRs run test and db-test in checks.yml, on the podman runner; main re-runs
  # them (checks.yml, called below) before the image, so main never deploys untested code until ukubi-cd gates
  # CD. To rebuild the tip: `gh workflow run app.yml --ref main`.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'internal/**'
      - 'contract/**'
      - 'api/**'
      - 'buf.yaml'
      - 'buf.gen.yaml'
      - 'realms/**'
      - 'cmd/**'
      - 'www/**'
      - 'embed.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.github/workflows/app.yml'
      - '!helm/**'
      - '!plan/**'

# Forgejo honours only workflow-level concurrency (the job-level groups inside
# ukubi-ci's image.yml are ignored there): a second main run queues, never cancels a running build.
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # No if: on either uses: job. Forgejo evaluates it inside the called workflow, where event_name is workflow_call.
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  # Build, push and deploy live in the shared ukubi-ci workflow (digest-pinned tag, stale-run guard, deploy job).
  # The workflow-level group above serialises main runs (Forgejo ignores image.yml's job-level groups).
  image:
    needs: checks
    # Registry creds are readable only on push/workflow_dispatch (OIDC claim), the only events this workflow has.
    uses: MohammadBnei/ukubi-ci/.github/workflows/image.yml@d683f2091575188024f7e1200e619977d9db19ae # ukubi-ci PR 28 head; re-pin to the release
    with:
      # The pin file on the deploy branch (ukubi-ci 0.11), not main's values.
      values-file: helm/image.yaml
      runs-on: '["ukubi-build"]'
      image: mountain
    # image.yml's build job reads the registry password over OIDC, its deploy job pushes the bump.
    permissions:
      contents: write
      id-token: write
