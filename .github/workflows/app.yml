# Test, build the relay image on the build-runner LXC, push it to the in-cluster
# Zot registry, then pin the tag in helm/values.yaml so ArgoCD rolls it out.
# Copied from hq's .github/workflows/app.yml; its gotchas, paid for once:
#   - every buildah call goes through sudo (rootless splits the auth file)
#   - --tls-verify=false on login AND push (plain HTTP; LE can't issue for .lan)
#   - the deploy job needs always() && result == 'success'
#   - --layers, or buildah caches nothing; --pull=newer, or the Go base image
#     stays at the patch the box first pulled
#   - the bump pushes with GITHUB_TOKEN, which never triggers another run
#     (and helm/** is not a trigger path, so the bump cannot loop either)
name: app

on:
  workflow_dispatch:
  # PRs run the test job only: build-push and deploy are guarded to push/workflow_dispatch.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'relay/**'
      - 'www/**'
      - 'embed.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.github/workflows/app.yml'
      - '!helm/**'
      - '!plan/**'

env:
  REGISTRY: registry.bnei.lan:5000
  # Not a secret, and an empty secret cost agent-fleet a release once.
  REGISTRY_USER: ci
  IMAGE: mountain
  # The registry password comes from the shared platform-commons project over
  # GitHub OIDC (infra-bootstrap ADR-0049). The identity binds a repository
  # allowlist (MohammadBnei/mountain is on it) plus event_name
  # push/workflow_dispatch only.
  INFISICAL_DOMAIN: https://infisical.bnei.dev
  INFISICAL_PROJECT_SLUG: platform-commons-76pb
  INFISICAL_ENV: dev
  INFISICAL_IDENTITY_ID: 19807471-d73a-48d4-9e58-1dc34255ef77

jobs:
  test:
    runs-on: [self-hosted, ukubi-build]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # rules_test.go runs `promtool test rules` (and fails, not skips, under CI without it).
      - name: promtool 3.5.0
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            X64) a=amd64 s=e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a ;;
            ARM64) a=arm64 s=173389cc42bf09c4e6e54cb53fa07a5a835d7c261e14775d2183181d6e385d1c ;;
            *) echo "::error::no promtool for $RUNNER_ARCH"; exit 1 ;;
          esac
          f="$RUNNER_TEMP/prom.tgz"
          curl -sSfL -o "$f" "https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-$a.tar.gz"
          echo "$s  $f" | sha256sum -c -
          tar -xzf "$f" -C "$RUNNER_TEMP" --strip-components=1 "prometheus-3.5.0.linux-$a/promtool"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: go vet + go test
        run: |
          set -euo pipefail
          go vet ./...
          go test ./...
      - name: Schema check (Go-generated hello fixture)
        run: |
          set -euo pipefail
          go run ./relay dump-hello --events www/dev/fixtures/hello-events.json --out "$RUNNER_TEMP/hello.json"
          node www/dev/schema/check.mjs "$RUNNER_TEMP/hello.json"
          node www/dev/schema/check.mjs
      # Chrome is not installed on ukubi-build and is not apt-installed here (04): the gate
      # selftest runs only where a Chrome already exists; otherwise it is a local pre-merge step.
      - name: www core test + gate selftest (if Chrome)
        run: |
          set -euo pipefail
          if [ -f www/dev/core.test.mjs ]; then node www/dev/core.test.mjs; fi
          CHROME="${CHROME:-$(command -v google-chrome chromium chromium-browser 2>/dev/null | head -n1 || true)}"
          if [ -n "$CHROME" ] && [ -f www/dev/gate.mjs ]; then
            CHROME="$CHROME" node www/dev/gate.mjs selftest
          else
            echo "::notice::no Chrome on this runner: run 'node www/dev/gate.mjs selftest' locally before merge (04)"
          fi

  # Persistence tests need a real Postgres: TestDB* skip without MOUNTAIN_TEST_DSN (the self-hosted
  # test job above has none). GitHub-hosted, so the service container needs no runner change.
  db-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: mountain
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      MOUNTAIN_TEST_DSN: postgres://postgres:mountain@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # the replay frame is validated by www/dev/schema/check.mjs
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: DB tests
        run: go test -run '^TestDB' -v ./relay/

  build-push:
    needs: [test, db-test]
    # Registry creds are readable only on push/workflow_dispatch (OIDC claim).
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, ukubi-build]
    concurrency:
      group: app-build
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write # the Infisical OIDC login
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute the image tag
        id: tag
        run: echo "value=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      # Not baked into the runner image; a no-op after the first run.
      - name: Ensure buildah
        run: command -v buildah || (sudo apt-get update -qq && sudo apt-get install -y -qq buildah)

      # Only REGISTRY_PASSWORD, not the whole environment.
      - name: Read the registry password from Infisical
        uses: Infisical/secrets-action@v1.0.12
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          oidc-audience: infisical.bnei.dev
          domain: ${{ env.INFISICAL_DOMAIN }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ env.INFISICAL_ENV }}
          secret-path: /
          secret-name: REGISTRY_PASSWORD
          export-type: env

      # GitHub masks only secrets.*; an unmasked Infisical value leaked a token
      # in this estate once.
      - name: Mask the fetched password
        run: echo "::add-mask::$REGISTRY_PASSWORD"

      - name: Registry login
        run: |
          set -euo pipefail
          [ -n "${REGISTRY_PASSWORD:-}" ] || { echo "::error::Infisical returned no REGISTRY_PASSWORD"; exit 1; }
          printf '%s' "$REGISTRY_PASSWORD" | sudo buildah login \
            --tls-verify=false \
            --username "$REGISTRY_USER" \
            --password-stdin "$REGISTRY"

      - name: Build and push
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          sudo buildah bud \
            --isolation chroot \
            --format docker \
            --layers \
            --pull=newer \
            -f Dockerfile \
            -t "$REGISTRY/$IMAGE:$TAG" \
            .
          sudo buildah push --tls-verify=false "$REGISTRY/$IMAGE:$TAG"

      # Its own step, so a failed push does not leave the tag in the shared store.
      - name: Remove the local image
        if: always()
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: sudo buildah rmi "$REGISTRY/$IMAGE:$TAG" || true

  deploy:
    needs: build-push
    # A dispatch on another branch builds that branch; only main deploys.
    if: always() && needs.build-push.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: app-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      TAG: ${{ needs.build-push.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Bump the pinned image tag
        run: |
          set -euo pipefail
          [ -n "$TAG" ] || { echo "::error::empty image tag"; exit 1; }
          sed -i -E "s/^(  tag: \")[^\"]+(\")/\1${TAG}\2/" helm/values.yaml
          # A no-op sed is the real failure mode: it commits nothing and the
          # deploy looks green while the cluster keeps the old image.
          grep -q "tag: \"${TAG}\"" helm/values.yaml \
            || { echo "::error::tag bump did not land in helm/values.yaml"; exit 1; }

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "mountain-ci"
          git config user.email "noreply@bnei.dev"
          git add helm/values.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(deploy): bump mountain image to ${TAG}"
          # main also takes local pushes; retry if it moves under us.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::could not push the tag bump"; exit 1
