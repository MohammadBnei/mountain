# mountain's commits and PRs carry no AI trailer, session link or co-author (CLAUDE.md of the estate; the other
# repos' rules are in plan/00-decisions.md's trailer table). Scans every commit message in the PR's range
# and its title and body: .github/scripts/check-trailers.py, self-tested by check-trailers-test.sh.
# The PR's own text is scanned too, so describing the rules with the strings they refuse (the domain, an example
# model id, a quoted trailer) fails the PR that does it: write "claude links" and "model names" in words.
name: trailers

on:
  pull_request:
    branches: [main]
    # edited: a title or body change must be re-checked; synchronize: a new commit.
    types: [opened, reopened, synchronize, edited]

jobs:
  trailers:
    runs-on: k8s-ubuntu-latest
    permissions:
      contents: read
    steps:
      # The whole history: the range is base..head, and the base branch bounds it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Self-test of the check
        run: .github/scripts/check-trailers-test.sh
      # The PR's own text reaches the script through env, never interpolated into the shell: it is untrusted.
      - name: No AI trailers, session links or model names
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/check-trailers.py "$BASE_SHA" "$HEAD_SHA"
