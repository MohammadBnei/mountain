<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ukubi atlas</title>
<meta name="description" content="The ukubi system as a map: realms, their parts, the routes between them, live.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
<script type="importmap">{"imports":{"three":"./vendor/build/three.module.js","three/addons/":"./vendor/examples/jsm/"}}</script>
<script type="module" src="./js/main.js"></script>
</head>
<body>
<header id="top">
<div id="where"><p id="level" class="kicker">L0 · MAP</p><nav id="crumbs" aria-label="Breadcrumb"></nav></div>
<div class="seg" role="group" aria-label="Level"><button id="level-0" type="button" aria-pressed="true">Map</button><button id="level-1" type="button" aria-pressed="false">Trade routes</button></div>
<div class="seg" role="group" aria-label="Lens"><button id="lens-structure" type="button" aria-pressed="true">Structure</button><button id="lens-land" type="button" aria-pressed="false">Land lens</button></div>
<label id="find">Search<input id="search" type="search" autocomplete="off" placeholder="core, wird, ADR-0065…"></label>
<button id="last" type="button" disabled>Last event · L</button>
<form id="signout" method="post" action="/auth/logout" hidden><span id="who"></span><button type="submit">Sign out</button></form>
</header>
<div id="results" hidden></div>
<main>
<div id="stage">
<canvas id="c" aria-label="The system map. Every view has a list in the panel."></canvas>
<div id="labels" aria-hidden="true"></div>
<p id="loader">Reading the system…</p>
<p id="fallback" hidden>This page draws the system in 3D and needs WebGL2.</p>
<div id="minimap"></div>
</div>
<aside id="panel"></aside>
</main>
<p id="status" role="status"></p>
</body>
</html>
